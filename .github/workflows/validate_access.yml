name: Validate Access Flow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build web
        run: flutter build web --release --base-href "/glass_pactory_production/"

      - name: Verify password plus owner-email OTP flow
        shell: bash
        run: |
          set -euo pipefail
          grep -q "rashedhathalmic@gmail.com" lib/main.dart
          grep -q "signInWithEmailAndPassword" lib/main.dart
          grep -q "createGeneratorAccessRequest" lib/main.dart
          grep -q "verifyGeneratorAccessOtp" lib/main.dart
          grep -q "Persistence.NONE" lib/main.dart
          grep -q "requestOtp" lib/core/helpers/generator_login_alert_web.dart
          grep -q "verifyOtp" lib/core/helpers/generator_login_alert_web.dart
          grep -q "verifyFirebaseIdToken_" apps_script/generator_access_otp.gs
          grep -q "MailApp.sendEmail" apps_script/generator_access_otp.gs
          grep -q "MAX_OTP_ATTEMPTS = 5" apps_script/generator_access_otp.gs
          grep -q "OTP_TTL_SECONDS = 600" apps_script/generator_access_otp.gs
          if grep -q "sendSignInLinkToEmail" lib/main.dart; then
            echo "Passwordless email-link flow must not be present"
            exit 1
          fi
