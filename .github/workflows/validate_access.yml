name: Validate Access Flow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build web
        run: flutter build web --release --base-href "/glass_pactory_production/"

      - name: Verify owner-controlled email access flow
        shell: bash
        run: |
          set -euo pipefail
          grep -q "rashedhathalmic@gmail.com" lib/main.dart
          grep -q "sendSignInLinkToEmail" lib/main.dart
          grep -q "signInWithEmailLink" lib/main.dart
          grep -q "Persistence.SESSION" lib/main.dart
          if grep -q "createGeneratorAccessRequest" lib/main.dart; then
            echo "Legacy Apps Script approval is still referenced by main.dart"
            exit 1
          fi
          if grep -q "pollGeneratorAccessRequest" lib/main.dart; then
            echo "Legacy Apps Script polling is still referenced by main.dart"
            exit 1
          fi
