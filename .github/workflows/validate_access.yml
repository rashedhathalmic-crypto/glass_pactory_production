name: Validate Access Flow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build web
        run: flutter build web --release --base-href "/glass_pactory_production/"

      - name: Verify approval service
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 20 'https://script.google.com/macros/s/AKfycbxwidW-HceCIzOnF8jNx3Ewl5tkKvtjHDRNni75mbGi/exec?action=health')"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
