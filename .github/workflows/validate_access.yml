name: Validate Access Flow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build web
        run: flutter build web --release --base-href "/glass_pactory_production/"

      - name: Diagnose approval service
        shell: bash
        run: |
          set +e
          url='https://script.google.com/macros/s/AKfycbxwidW-HceCIzOnF8jNx3Ewl5tkKvtjHDRNni75mbGi/exec?action=health'
          curl --silent --show-error --location --max-time 30 \
            --dump-header /tmp/headers.txt \
            --output /tmp/body.txt \
            --write-out 'HTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\n' \
            "$url"
          curl_code=$?
          echo "CURL_EXIT=$curl_code"
          echo '--- HEADERS ---'
          cat /tmp/headers.txt || true
          echo '--- BODY ---'
          cat /tmp/body.txt || true
          echo
          if [ "$curl_code" -ne 0 ]; then exit "$curl_code"; fi
          grep -q '"ok":true' /tmp/body.txt
