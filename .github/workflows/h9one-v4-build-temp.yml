name: H9 One v4 full build verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-5x:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore H9 source package
        shell: bash
        run: |
          cat > /tmp/h9.b64 <<'EOF_B64'

EOF_B64
          base64 -d /tmp/h9.b64 > /tmp/H9_One_v4_Alpha2_TESTED_SOURCE.zip
          mkdir -p /tmp/h9work
          unzip -q /tmp/H9_One_v4_Alpha2_TESTED_SOURCE.zip -d /tmp/h9work
          test -f /tmp/h9work/H9_One_v4_Alpha2/app/build.gradle
      - name: Generate Gradle Wrapper
        shell: bash
        working-directory: /tmp/h9work/H9_One_v4_Alpha2
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew tests/run5.sh
          ./gradlew --version
      - name: Full Android build 5x
        shell: bash
        working-directory: /tmp/h9work/H9_One_v4_Alpha2
        run: |
          set -euo pipefail
          mkdir -p /tmp/h9builds
          : > /tmp/FULL_BUILD_5X.txt
          for n in 1 2 3 4 5; do
            echo "=== FULL ANDROID BUILD $n/5 ===" | tee -a /tmp/FULL_BUILD_5X.txt
            ./gradlew --no-daemon clean assembleDebug 2>&1 | tee -a /tmp/FULL_BUILD_5X.txt
            APK=app/build/outputs/apk/debug/app-debug.apk
            test -s "$APK"
            unzip -t "$APK" >/dev/null
            cp "$APK" "/tmp/h9builds/H9-One-v4-Alpha2-cycle-$n.apk"
            echo "PASS FULL BUILD $n" | tee -a /tmp/FULL_BUILD_5X.txt
          done
          cp /tmp/h9builds/H9-One-v4-Alpha2-cycle-5.apk H9-One-v4-Alpha2.apk
      - name: Host logic and feature verification 5x
        shell: bash
        working-directory: /tmp/h9work/H9_One_v4_Alpha2
        run: |
          set -euo pipefail
          bash tests/run5.sh | tee TEST_OUTPUT_FINAL_5X.txt
      - name: Verify final APK and make report
        shell: bash
        working-directory: /tmp/h9work/H9_One_v4_Alpha2
        run: |
          set -euo pipefail
          test -s H9-One-v4-Alpha2.apk
          unzip -t H9-One-v4-Alpha2.apk >/dev/null
          sha256sum H9-One-v4-Alpha2.apk | tee APK_SHA256.txt
          SIZE=$(stat -c%s H9-One-v4-Alpha2.apk)
          cat > FINAL_TEST_REPORT.md <<EOF
          # H9 One v4 Alpha 2 — Final Build Verification
          - Full Android clean build cycles: 5/5 PASS
          - APK integrity checks: 5/5 PASS
          - Host feature verification cycles: 5/5 PASS
          - Host logic tests: 5/5 PASS
          - Final APK size: $SIZE bytes
          - Package: com.h9one.safe
          - Build type: debug/installable APK
          - Device/ADB testing: intentionally not used for this verification
          EOF
          cp /tmp/FULL_BUILD_5X.txt FULL_BUILD_5X.txt
          cd /tmp/h9work
          zip -qr /tmp/H9_One_v4_Alpha2_COMPLETE.zip H9_One_v4_Alpha2
      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: H9_One_v4_Alpha2_COMPLETE
          path: |
            /tmp/H9_One_v4_Alpha2_COMPLETE.zip
            /tmp/h9work/H9_One_v4_Alpha2/H9-One-v4-Alpha2.apk
            /tmp/h9work/H9_One_v4_Alpha2/FINAL_TEST_REPORT.md
            /tmp/h9work/H9_One_v4_Alpha2/FULL_BUILD_5X.txt
            /tmp/h9work/H9_One_v4_Alpha2/TEST_OUTPUT_FINAL_5X.txt
            /tmp/h9work/H9_One_v4_Alpha2/APK_SHA256.txt
          if-no-files-found: error
