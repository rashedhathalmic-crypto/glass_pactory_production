[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-pactory-cnc-nc-generator"
version = "0.1.0"
description = "Standalone SKG1625 Shanlong L68 NC generator desktop application"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
glass-cnc-nc-generator = "cnc_nc_generator.app:main"
glass-cnc-nc-cli = "cnc_nc_generator.cli:main"

[tool.setuptools.packages.find]
include = ["cnc_nc_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
